<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0A14" />
    <title>SmartzConnect — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body {
        min-height: 100vh; margin: 0; display: grid; place-items: center;
        background: #0D0A14; color: #fff; text-align: center;
      }
      main { max-width: 28rem; padding: 2rem; }
      img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 1.5rem; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { margin: 0; color: rgba(255,255,255,.65); line-height: 1.6; }
      button {
        margin-top: 1.5rem; border: 0; border-radius: 999px; padding: .75rem 1.25rem;
        background: linear-gradient(135deg, #FF4D8D, #9B5DE5); color: #fff;
        font: inherit; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="SmartzConnect" />
      <h1>You’re offline</h1>
      <p>Reconnect to the internet and try again. SmartzConnect will be ready when your connection returns.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
